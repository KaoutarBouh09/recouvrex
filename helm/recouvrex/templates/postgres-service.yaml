apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.name }}
  labels:
    {{- include "recouvrex.labels" . | nindent 4 }}
    {{- include "recouvrex.selectorLabels" (dict "component" "postgres" "Release" .Release) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "recouvrex.selectorLabels" (dict "component" "postgres" "Release" .Release) | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
      protocol: TCP
