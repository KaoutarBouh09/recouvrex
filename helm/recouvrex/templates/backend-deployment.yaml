apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.name }}
  labels:
    {{- include "recouvrex.labels" . | nindent 4 }}
    {{- include "recouvrex.selectorLabels" (dict "component" "backend" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "recouvrex.selectorLabels" (dict "component" "backend" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "recouvrex.labels" . | nindent 8 }}
        {{- include "recouvrex.selectorLabels" (dict "component" "backend" "Release" .Release) | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP

          # ── ConfigMap env vars ──────────────────────────────────────
          envFrom:
            - configMapRef:
                name: {{ .Values.backend.name }}-config

          # ── Secret env vars ─────────────────────────────────────────
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.name }}-secret
                  key: JWT_SECRET
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.name }}-secret
                  key: DB_PASSWORD
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.name }}-secret
                  key: GEMINI_API_KEY
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.name }}-secret
                  key: TWILIO_ACCOUNT_SID
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.name }}-secret
                  key: TWILIO_AUTH_TOKEN
            - name: TWILIO_FROM_NUMBER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.name }}-secret
                  key: TWILIO_FROM_NUMBER
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.name }}-secret
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.name }}-secret
                  key: MAIL_PASSWORD
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.name }}-secret
                  key: CLOUDINARY_API_SECRET
            
          # ── Health probes ───────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 450
            periodSeconds: 15
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 900
            periodSeconds: 30
            failureThreshold: 5

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
