# ─────────────────────────────────────────────────────────
#  Recouvrex — Production profile (chargé par Kubernetes/Helm)
#  Toutes les valeurs sensibles viennent des env vars injectées par Helm
# ─────────────────────────────────────────────────────────

# ── Application ───────────────────────────────────────────
spring.application.name=recouvrex-services
server.port=8080

# ── Datasource ────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ── Multipart ─────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── JPA ───────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ── Mail ──────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Keycloak / OAuth2 ─────────────────────────────────────
# Pointe vers le Keycloak déployé dans le cluster Kubernetes
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI}

# ── JWT converter ─────────────────────────────────────────
jwt.auth.converter.resource-id=frontend
jwt.auth.converter.principal-attribute=preferred_username

# ── Resilience4j ──────────────────────────────────────────
resilience4j.retry.instances.keycloak.max-attempts=10
resilience4j.retry.instances.keycloak.wait-duration=5s

# ── Actuator ──────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# ── Camunda ───────────────────────────────────────────────
camunda.bpm.enabled=true
camunda.bpm.generic-properties.properties.historyTimeToLive=P1D
camunda.bpm.admin-user.id=demo
camunda.bpm.admin-user.password=demo
camunda.bpm.admin-user.email=ufo@andromeda.com
camunda.bpm.admin-user.first-name=Andromeda
camunda.bpm.admin-user.last-name=Galaxy
camunda.bpm.database.schema-update=true
camunda.bpm.filter.create=All
camunda.bpm.authorization.enabled=true
camunda.bpm.history-level=full
camunda.bpm.auto-deployment-enabled=true
camunda.bpm.default-number-of-retries=3
camunda.bpm.job-execution.enabled=true
camunda.bpm.webapp.application-path=/camunda

# ── Swagger ───────────────────────────────────────────────
springdoc.show-actuator=true
springdoc.swagger-ui.path=/api
springdoc.swagger-ui.operations-sorter=method

# ── Cloudinary ────────────────────────────────────────────
cloudinary.cloud_name=dm9udoven
cloudinary.api_key=362739563856358
cloudinary.api_secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=recouvrex_photos

# ── Twilio ────────────────────────────────────────────────
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number="+12318803498"

# ── Gemini ────────────────────────────────────────────────
gemini.api-key=${GEMINI_API_KEY}
gemini.api-url=https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent

# ── CORS ──────────────────────────────────────────────────
app.cors.allowed-origins=http://recouvrex.local
app.chatbot.base-url=http://recouvrex.local

# ── Chatbot ───────────────────────────────────────────────
chatbot.trigger.overdue-days=15
